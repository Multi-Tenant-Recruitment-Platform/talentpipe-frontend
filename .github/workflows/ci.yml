name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build
      - name: Install, type-check and build
        run: |
          npm ci
          npm run build
