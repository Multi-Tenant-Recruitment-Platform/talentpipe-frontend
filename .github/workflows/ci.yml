name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build
      - name: Install, type-check and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test
        run: npm test

  # Static analysis via SonarCloud (or a self-hosted SonarQube).
  # Needs SONAR_TOKEN — see talentpipe-backend: docs/QUALITY.md.
  #
  # Opted in by the SONAR_CI_ANALYSIS repository variable, because SonarCloud
  # allows a project exactly one analysis method. While Automatic Analysis is
  # enabled server-side, the scanner refuses to run at all — it aborts with
  # "You are running CI analysis while Automatic Analysis is enabled" and exits
  # 3 before uploading anything. That check reads the project's server-side
  # setting, so no file in this repository can satisfy it; running the job
  # anyway just paints the pull request red next to a green Automatic Analysis.
  #
  # To hand analysis over to CI — worth doing, because this is the only method
  # that imports coverage/lcov.info, so coverage conditions on the quality gate
  # measure something real rather than reporting N/A:
  #   1. SonarCloud → project → Administration → Analysis Method →
  #      turn Automatic Analysis OFF.
  #   2. GitHub → Settings → Secrets and variables → Actions → Variables →
  #      set SONAR_CI_ANALYSIS = true.
  # Both steps, in that order. Until then Automatic Analysis stays the project's
  # analysis and reports as the separate "SonarCloud Code Analysis" check.
  sonar:
    if: ${{ vars.SONAR_CI_ANALYSIS == 'true' }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Set up Node.js
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # The scanner reads coverage/lcov.info from this workspace, so it has to
      # be generated in this job — the build job's files are not visible here.
      - name: Generate coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      # Speeds up repeat runs of the scanner engine/plugins.
      - name: Cache Sonar packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # v6: v5 emits a "no longer supported and contains a security
      # vulnerability" warning on every run. Analysis settings live in
      # sonar-project.properties rather than in an `args:` input here.
      # Pinned by commit SHA (the trailing comment records the tag): a mutable
      # tag lets a compromised upstream release run with this job's SONAR_TOKEN.
      - name: Sonar analysis (skipped until SONAR_TOKEN is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
