name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

# ---------------------------------------------------------------------------
# Static analysis is NOT run from here.
#
# SonarCloud is bound to this repository through its GitHub App, which runs
# Automatic Analysis and posts the "SonarCloud Code Analysis" check on every
# pull request. SonarCloud refuses CI-based analysis while Automatic Analysis
# is enabled, so a scanner job in this workflow can only ever fail — which is
# exactly what it did: the job existed but had never completed successfully,
# and no coverage measure was ever recorded on the project as a result.
#
# If coverage reporting is wanted later (Automatic Analysis cannot run the
# test suite, so it cannot produce one), the switch is deliberate and has two
# halves that must happen together:
#
#   1. Turn OFF Automatic Analysis:
#      SonarCloud -> project -> Administration -> Analysis Method
#   2. Re-add a scanner job here that runs `npm run test:coverage` and then
#      sonarsource/sonarqube-scan-action, with SONAR_TOKEN in repo secrets.
#      sonar-project.properties already carries the correct organization,
#      project key and lcov path for that job.
#
# Doing only half of this reintroduces the failure this comment replaces.
# ---------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build.
      # --ignore-scripts: no dependency here needs an install-time script —
      # esbuild (vite's bundler) resolves its native binary through
      # optionalDependencies, which npm installs regardless of this flag, so
      # skipping lifecycle scripts costs nothing and closes off arbitrary code
      # execution from a compromised package's postinstall hook.
      - name: Install, type-check and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test
        run: npm test
