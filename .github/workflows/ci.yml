name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build
      - name: Install, type-check and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test
        run: npm test

  # Static analysis via SonarCloud (or a self-hosted SonarQube).
  # Inactive until SONAR_TOKEN is configured — see talentpipe-backend: docs/QUALITY.md.
  #
  # This job is the project's only analysis: Automatic Analysis must stay OFF
  # in SonarCloud (Project → Administration → Analysis Method). The scanner
  # refuses to run alongside it ("You are running CI analysis while Automatic
  # Analysis is enabled", exit 3), and only a CI run can upload the coverage
  # report the quality gate reads.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Set up Node.js
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # The scanner reads coverage/lcov.info from this workspace, so it has to
      # be generated in this job — the build job's files are not visible here.
      - name: Generate coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      # Speeds up repeat runs of the scanner engine/plugins.
      - name: Cache Sonar packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # v6: v5 emits a "no longer supported and contains a security
      # vulnerability" warning on every run. Analysis settings live in
      # sonar-project.properties rather than in an `args:` input here.
      # Pinned by commit SHA (the trailing comment records the tag): a mutable
      # tag lets a compromised upstream release run with this job's SONAR_TOKEN.
      - name: Sonar analysis (skipped until SONAR_TOKEN is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
