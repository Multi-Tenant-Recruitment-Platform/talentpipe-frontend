name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build.
      # --ignore-scripts: no dependency here needs an install-time script —
      # esbuild (vite's bundler) resolves its native binary through
      # optionalDependencies, which npm installs regardless of this flag, so
      # skipping lifecycle scripts costs nothing and closes off arbitrary code
      # execution from a compromised package's postinstall hook.
      - name: Install, type-check and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test
        run: npm test

  # Static analysis via SonarCloud (or a self-hosted SonarQube).
  # Inactive until SONAR_TOKEN is configured — see talentpipe-backend: docs/QUALITY.md.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Set up Node.js
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # The scanner reads coverage/lcov.info from this workspace, so it has to
      # be generated in this job — the build job's files are not visible here.
      - name: Generate coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Sonar analysis (skipped until SONAR_TOKEN is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
