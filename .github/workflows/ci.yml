name: frontend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm run build = tsc (strict type-check) + vite production build
      - name: Install, type-check and build
        run: |
          npm ci
          npm run build

      - name: Test
        run: npm test

  # Static analysis via SonarCloud (or a self-hosted SonarQube).
  # Inactive until SONAR_TOKEN is configured — see talentpipe-backend: docs/QUALITY.md.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Set up Node.js
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The scanner reads coverage/lcov.info from this workspace, so it has to
      # be generated in this job — the build job's files are not visible here.
      - name: Generate coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          npm ci
          npm run test:coverage

      - name: Sonar analysis (skipped until SONAR_TOKEN is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@v5
