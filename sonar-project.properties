# SonarQube/SonarCloud analysis — see docs in talentpipe-backend: docs/QUALITY.md
# SonarCloud project identity — both values come from the SonarCloud project
# page (+ → Analyze new project). This file is the single place they are set;
# CI passes no analysis arguments of its own.
sonar.organization=multi-tenant-recruitment-platform
sonar.projectKey=Multi-Tenant-Recruitment-Platform_talentpipe-frontend

sonar.projectName=TalentPipe Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Static assets, generated files and test scaffolding are not analyzed as
# production code (tests are still analyzed as tests, via sonar.tests below).
sonar.exclusions=**/assets/**,**/*.svg,**/vite-env.d.ts,**/data/mockDashboard.ts,**/*.test.ts,**/*.test.tsx,**/test/**

# Coverage — produced by `npm run test:coverage` (vitest + v8 → lcov).
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files vitest does not instrument (see coverage.exclude in vite.config.ts) are
# excluded here too, so the quality gate is not skewed by 0%-covered entrypoints.
sonar.coverage.exclusions=src/main.tsx,src/data/**,src/test/**,**/*.test.ts,**/*.test.tsx
