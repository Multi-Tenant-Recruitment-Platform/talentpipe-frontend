# SonarQube/SonarCloud analysis — see docs in talentpipe-backend: docs/QUALITY.md
# Set these two after creating the project in SonarCloud (or your SonarQube server):
sonar.projectKey=talentpipe-frontend
# sonar.organization=your-sonarcloud-org   # SonarCloud only — not needed for self-hosted

sonar.projectName=TalentPipe Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Static assets, generated files and test scaffolding are not analyzed as
# production code (tests are still analyzed as tests, via sonar.tests below).
sonar.exclusions=**/assets/**,**/*.svg,**/vite-env.d.ts,**/data/mockDashboard.ts,**/*.test.ts,**/*.test.tsx,**/test/**

# Coverage — produced by `npm run test:coverage` (vitest + v8 → lcov).
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
