# SonarQube/SonarCloud analysis — see docs in talentpipe-backend: docs/QUALITY.md
# Set these two after creating the project in SonarCloud (or your SonarQube server):
sonar.projectKey=talentpipe-frontend
# sonar.organization=your-sonarcloud-org   # SonarCloud only — not needed for self-hosted

sonar.projectName=TalentPipe Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Static assets and generated files are not analyzed
sonar.exclusions=**/assets/**,**/*.svg,**/vite-env.d.ts,**/data/mockDashboard.ts

# Coverage (uncomment when a test runner with lcov output is added):
# sonar.tests=src
# sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
