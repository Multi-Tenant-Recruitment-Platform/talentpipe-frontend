# SonarCloud configuration — see docs in talentpipe-backend: docs/QUALITY.md
#
# Analysis today runs through SonarCloud's Automatic Analysis (the GitHub App),
# which reads the scope settings below — sources, tests, exclusions. It does
# NOT use sonar.organization / sonar.projectKey, because the GitHub binding
# already tells it which project it is looking at.
#
# Those two keys matter only to a CI-based scanner. They are set correctly here
# so that re-enabling one is a workflow change alone, and they mirror
# talentpipe-backend/backend/pom.xml: when a repository is imported from
# GitHub, SonarCloud derives the project key as <GitHubOrg>_<repo> and the
# organization key as the lowercased org slug. A key that does not match the
# provisioned project fails a scan just as surely as a missing organization —
# only with a less obvious message.
sonar.organization=multi-tenant-recruitment-platform
sonar.projectKey=Multi-Tenant-Recruitment-Platform_talentpipe-frontend

sonar.projectName=TalentPipe Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Static assets, generated files and test scaffolding are not analyzed as
# production code (tests are still analyzed as tests, via sonar.tests below).
sonar.exclusions=**/assets/**,**/*.svg,**/vite-env.d.ts,**/data/mockDashboard.ts,**/*.test.ts,**/*.test.tsx,**/test/**

# Coverage — produced by `npm run test:coverage` (vitest + v8 → lcov).
# Consumed only by a CI-based scanner; Automatic Analysis cannot run the test
# suite, so no coverage measure is reported while it is the analysis method.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
