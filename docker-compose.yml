# ---------------------------------------------------------------------------
# TalentPipe frontend — containerised SPA.
#
# The backend stack (PostgreSQL + Spring Boot) is managed separately, in the
# talentpipe-backend repository:
#
#     cd ../talentpipe-backend/infra && docker compose up -d postgres backend
#
# This compose file deliberately knows nothing about that stack. It reaches the
# API over host.docker.internal, which resolves to the Docker host — so the
# same image works whether the backend is a container publishing :8080 or a
# `mvnw spring-boot:run` process on the host.
#
#     docker compose up -d --build     ->  http://localhost:5173
# ---------------------------------------------------------------------------
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative: nginx proxies /api to the backend, keeping one origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: talentpipe-frontend
    ports:
      # 5173 matches the backend's FRONTEND_BASE_URL default, so the links it
      # puts in invitation and verification emails resolve against this
      # container with no backend reconfiguration. Note this is the same port
      # `npm run dev` uses — run one or the other, not both.
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      # No trailing slash; nginx appends the request URI.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://host.docker.internal:8080}
    extra_hosts:
      # Required on Linux, harmless on Docker Desktop, where it already exists.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
